<touchégg>

  <!--
    Touchpad gestures for i3.

    i3 has no native gesture support (bindgesture is Sway-only), so Touchégg
    recognises the gesture and drives i3 through i3-msg.

    The recogniser is a system daemon (touchegg.service); the per-session
    client is started from ~/.config/i3/config.

    3 fingers  left/right/up/down  ->  move focus between windows
    4 fingers  left/right          ->  move between workspaces on this output

    Directions are direct: swipe left goes left. Note this is deliberately NOT
    inverted to match the natural scrolling set in 30-touchpad.conf.

    workspace prev_on_output / next_on_output is used rather than prev / next
    so a swipe never jumps to the external display, which holds workspace 9
    (see "workspace 9 output $sm" in the i3 config).
  -->

  <settings>
    <!-- How far a swipe must travel before the action fires. Raise this if a
         three-finger swipe is being mistaken for a three-finger tap, which is
         mapped to middle-click by TappingButtonMap "lrm". -->
    <property name="action_execute_threshold">20</property>
    <property name="animation_delay">150</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <application name="All">

    <!-- ===== 3 fingers: focus between windows ===== -->

    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg focus left</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg focus right</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg focus up</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg focus down</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- ===== 4 fingers: move between workspaces ===== -->

    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg workspace prev_on_output</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>i3-msg workspace next_on_output</command>
        <on>begin</on>
      </action>
    </gesture>

  </application>

</touchégg>
