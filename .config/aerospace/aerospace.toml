# AeroSpace config — mirrors ~/.config/i3/config as closely as macOS allows.
#
# $mod: i3 uses Mod4 (Super). On macOS that key is Cmd, but hijacking Cmd
# breaks system shortcuts (Cmd+Q/W/D/Space/1-9), so this config uses Option
# (alt) as the mod key — AeroSpace's convention. The letter layout is
# otherwise identical to the i3 config. To use Cmd instead, replace 'alt-'
# with 'cmd-' below.

start-at-login = true

# No peek strips in accordion (stacking) layout — each window looks fullscreen
accordion-padding = 0

# i3 does manual splits (mod+h / mod+v); AeroSpace's split command only works
# with flat-container normalization disabled.
enable-normalization-flat-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# default_border pixel 0 — macOS windows have no WM borders; nothing needed.

[mode.main.binding]

# start a terminal ($mod+Return; Ghostty on macOS — Alacritty is unnotarized
# and Gatekeeper blocks it)
alt-enter = 'exec-and-forget open -na Ghostty'

# kill focused window ($mod+Shift+q)
alt-shift-q = 'close'

# $mod+d (dmenu) / $mod+Shift+d (rofi) — use Spotlight (Cmd+Space) or Raycast
# on macOS; AeroSpace cannot trigger Spotlight directly.

# change focus ($mod+j/k/l/; — i3 default layout, not hjkl)
alt-j = 'focus left'
alt-k = 'focus down'
alt-l = 'focus up'
alt-semicolon = 'focus right'

# alternatively, cursor keys
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# move focused window ($mod+Shift+j/k/l/;)
alt-shift-j = 'move left'
alt-shift-k = 'move down'
alt-shift-l = 'move up'
alt-shift-semicolon = 'move right'

# alternatively, cursor keys
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# split in horizontal / vertical orientation ($mod+h / $mod+v)
alt-h = 'split horizontal'
alt-v = 'split vertical'

# fullscreen toggle ($mod+f)
alt-f = 'fullscreen'

# change container layout ($mod+s stacking, $mod+w tabbed, $mod+e toggle split)
# AeroSpace equivalents: v_accordion ~ stacking, h_accordion ~ tabbed
alt-s = 'layout v_accordion'
alt-w = 'layout h_accordion'
alt-e = 'layout tiles horizontal vertical'

# toggle tiling / floating ($mod+Shift+space)
alt-shift-space = 'layout floating tiling'

# $mod+space (focus mode_toggle) and $mod+a (focus parent) have no AeroSpace
# equivalent yet — https://github.com/nikitabobko/AeroSpace/issues/5

# switch to workspace ($mod+1..0)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# move focused container to workspace ($mod+Shift+1..0)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# reload the configuration file ($mod+Shift+c; $mod+Shift+r restart → reload too,
# AeroSpace has no separate in-place restart)
alt-shift-c = 'reload-config'
alt-shift-r = 'reload-config'

# $mod+Shift+e (exit i3) — quit AeroSpace from its menu bar icon instead.

# lock + suspend ($mod+x): sleep locks the screen on macOS
alt-x = 'exec-and-forget pmset sleepnow'
# $mod+Shift+x (shutdown) / $mod+Ctrl+Shift+x (reboot) intentionally not
# mapped — they require sudo on macOS and are easy to fat-finger.

# Screenshots (Print bindings) — use macOS built-ins:
#   Cmd+Shift+4 = region to file, Cmd+Ctrl+Shift+4 = region to clipboard,
#   Cmd+Shift+5 = screenshot UI. Keyboard layouts ($mod+F1-F3): use
#   System Settings > Keyboard > Input Sources.

# resize mode ($mod+r), same j/k/l/; and arrow bindings as i3
alt-r = 'mode resize'

[mode.resize.binding]
# i3: j shrink width, k grow height, l shrink height, ; grow width
j = 'resize width -50'
k = 'resize height +50'
l = 'resize height -50'
semicolon = 'resize width +50'

left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'

# back to normal: Enter or Escape or $mod+r
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'

# i3: workspaces 1-8 on external (HDMI-1), 9 on laptop screen (eDP-1).
# 'secondary' = external monitor, with fallback to main when undocked.
[workspace-to-monitor-force-assignment]
1 = ['secondary', 'main']
2 = ['secondary', 'main']
3 = ['secondary', 'main']
4 = ['secondary', 'main']
5 = ['secondary', 'main']
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = 'built-in'
