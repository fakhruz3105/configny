# ── General ────────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set-window-option -g pane-base-index 1
set -g history-limit 50000

# escape-time: default 500ms causes lag entering normal mode in nvim
set -sg escape-time 10

# focus-events: nvim's FocusGained autocmd (options.lua) won't fire without this
set -g focus-events on

# extended-keys: Ctrl+; has no ASCII control code, so the C-; pane binding can
# only be delivered via the CSI-u / modifyOtherKeys protocol. Ghostty speaks it;
# tmux has to be told to both request it upstream and forward it to nvim.
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# True colour — nvim sets termguicolors; tmux must advertise RGB to honor it
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,alacritty:RGB,xterm-ghostty:RGB"

# ── Prefix ─────────────────────────────────────────────────────────────────
# Default C-b collides with vim PageUp; C-a is the common convention
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# ── Splits / windows ───────────────────────────────────────────────────────
# Saner, mnemonic split bindings that keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-aware pane navigation ──────────────────────────────────────────────
# Pairs with christoomey/vim-tmux-navigator in nvim so <C-j/k/l/;> hop
# seamlessly across tmux panes and nvim splits. j=left, k=down, l=up, ;=right,
# matching the i3/AeroSpace layout rather than vim's hjkl.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
# Brace blocks, not quoted strings: a quoted "send-keys C-\;" has its semicolon
# eaten as a tmux command separator and the binding vanishes with no error.
bind -n C-j  if-shell "$is_vim" { send-keys C-j }  { select-pane -L }
bind -n C-k  if-shell "$is_vim" { send-keys C-k }  { select-pane -D }
bind -n C-l  if-shell "$is_vim" { send-keys C-l }  { select-pane -U }
bind -n C-\; if-shell "$is_vim" { send-keys C-\; } { select-pane -R }
bind -T copy-mode-vi C-j  select-pane -L
bind -T copy-mode-vi C-k  select-pane -D
bind -T copy-mode-vi C-l  select-pane -U
bind -T copy-mode-vi C-\; select-pane -R

# ── Copy mode (vi) ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Clipboard: pbcopy on macOS, xclip on Linux/X11
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
}

# ── Status line ────────────────────────────────────────────────────────────
set -g status-style bg=black,fg=colour39
set-window-option -g window-status-current-style bg=black,fg=white,bold

# ── Plugins (TPM) ──────────────────────────────────────────────────────────
# Replaces the old scripts/tmux-session: resurrect saves/restores sessions,
# windows, panes, layouts and pane contents; continuum automates it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'   # restore nvim sessions too
set -g @continuum-restore 'on'              # auto-restore on tmux start
set -g @continuum-save-interval '15'        # minutes between auto-saves

# Manual: prefix C-s = save, prefix C-r = restore
# Keep this run line LAST in the file.
run '~/.tmux/plugins/tpm/tpm'
