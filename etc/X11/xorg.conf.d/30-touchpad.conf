# Touchpad configuration for Dell Inspiron 16 5620 (Elan 04F3:314B, I2C HID).
# i3/X11 has no settings daemon, so libinput is configured here instead.
# Driver options: man 4 libinput

Section "InputClass"
    Identifier "Elan touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"

    # --- Tap to click -------------------------------------------------
    # 1 finger = left, 2 fingers = right, 3 fingers = middle.
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"

    # Tap-and-drag: double-tap, keep the finger down on the second tap,
    # then drag. No physical press is held, so the pad is not deformed
    # and the pointer does not jitter mid-drag.
    Option "TappingDrag" "on"
    # Drag lock: lifting the finger mid-drag does not drop the selection;
    # a further tap ends the drag. Lets you reposition without releasing.
    Option "TappingDragLock" "on"

    # --- Scrolling ----------------------------------------------------
    Option "ScrollMethod" "twofinger"
    Option "HorizontalScrolling" "on"
    # Content follows the fingers (macOS style).
    Option "NaturalScrolling" "true"
    # Finger travel per scroll unit. Default 15; lower = faster scrolling.
    # Try 10 if scrolling still feels sluggish, 20 if it overshoots.
    Option "ScrollPixelDistance" "10"

    # --- Pointer speed ------------------------------------------------
    # Range -1.0 (slowest) .. 1.0 (fastest). Left at the stock default 0.0
    # so pointer speed is unchanged from how the pad behaved originally.
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.0"

    # --- Accidental input ---------------------------------------------
    Option "DisableWhileTyping" "on"
EndSection
